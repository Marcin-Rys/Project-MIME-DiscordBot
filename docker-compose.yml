version: "3.9"

services:
  discord-bot:
    build: .
    container_name: project-mime-bot
    restart: unless-stopped

    # Pass environment variables from the .env file on the host
    env_file:
      - .env

    volumes:
      # Persistent storage for the SQLite database
      - ./data:/app/data
      # Bot configuration (modules.json, config.json, cooldowns.json)
      - ./config:/app/config
      # Language packs
      - ./lang:/app/lang

    # Optional: only start after a database service is healthy.
    # Uncomment the postgres section below and this depends_on block
    # if you migrate to PostgreSQL in the future.
    # depends_on:
    #   postgres:
    #     condition: service_healthy

